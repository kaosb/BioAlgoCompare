repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.1.5
  hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format

- repo: local
  hooks:
    - id: pytest-fast
      name: pytest-fast
      entry: pytest -q
      language: system
      pass_filenames: false
      always_run: true
# Pre-commit hooks configuration for BioAlgoCompare
# Ejecuta validaciones de calidad localmente antes de cada commit

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Configuración global
default_stages: [commit]
fail_fast: false
default_language_version:
  python: python3.9

repos:
  # =============================================================================
  # FORMATO Y ESTILO
  # =============================================================================
  
  # Ruff - Linter y formatter rápido (reemplaza Black, isort, flake8, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      # Ruff linter
      - id: ruff
        name: "🔍 Ruff - Code Quality Check"
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(legacy/|deprecated/|_v[0-9]+\.py$)
        
      # Ruff formatter
      - id: ruff-format
        name: "✨ Ruff - Code Formatting"
        exclude: ^(legacy/|deprecated/|_v[0-9]+\.py$)

  # =============================================================================
  # VALIDACIONES DE CÓDIGO
  # =============================================================================
  
  # Trailing whitespace
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: "🧹 Remove Trailing Whitespace"
      - id: end-of-file-fixer
        name: "📄 Fix End of Files"
      - id: check-yaml
        name: "📋 Validate YAML Files"
      - id: check-json
        name: "📋 Validate JSON Files"
      - id: check-toml
        name: "📋 Validate TOML Files"
      - id: check-added-large-files
        name: "📦 Check Large Files"
        args: ['--maxkb=1000']
      - id: check-case-conflict
        name: "🔤 Check Case Conflicts"
      - id: check-merge-conflict
        name: "⚔️ Check Merge Conflicts"
      - id: detect-private-key
        name: "🔐 Detect Private Keys"
      - id: check-ast
        name: "🐍 Validate Python Syntax"

  # =============================================================================
  # SEGURIDAD
  # =============================================================================
  
  # Bandit - Security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        name: "🔒 Bandit - Security Check"
        args: ['-ll', '-i', '-r']
        exclude: ^(tests/|legacy/|deprecated/)
        
  # Safety - Check dependencies
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.3
    hooks:
      - id: python-safety-dependencies-check
        name: "🛡️ Safety - Dependency Security"
        files: requirements.*\.txt$

  # =============================================================================
  # CALIDAD DE CÓDIGO
  # =============================================================================
  
  # MyPy - Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: "🔍 MyPy - Type Checking"
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies: [types-all]
        exclude: ^(tests/|legacy/|deprecated/)

  # =============================================================================
  # DOCUMENTACIÓN
  # =============================================================================
  
  # Docstring coverage
  - repo: https://github.com/econchick/interrogate
    rev: 1.5.0
    hooks:
      - id: interrogate
        name: "📝 Check Docstring Coverage"
        args: [-vv, --fail-under=50, --ignore-init-method, --ignore-init-module]
        exclude: ^(tests/|legacy/|deprecated/|scripts/)

  # =============================================================================
  # TESTS CRÍTICOS
  # =============================================================================
  
  # Pytest - Run critical tests only
  - repo: local
    hooks:
      - id: pytest-critical
        name: "🧪 Run Critical Tests"
        entry: bash -c 'pytest tests/test_algorithms_convergence.py tests/test_reproducibility_system.py -xvs -k "not slow"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]

  # =============================================================================
  # VALIDACIONES CUSTOM DEL PROYECTO
  # =============================================================================
  
  - repo: local
    hooks:
      # Verificar imports circulares
      - id: check-circular-imports
        name: "🔄 Check Circular Imports"
        entry: python scripts/analyze_imports.py --check-only
        language: system
        pass_filenames: false
        files: \.py$
        
      # Verificar reproducibilidad
      - id: check-reproducibility
        name: "🎲 Check Reproducibility Standards"
        entry: python scripts/enforce_reproducibility.py --directory algorithms --dry-run
        language: system
        pass_filenames: false
        files: ^algorithms/.*\.py$
        
      # Verificar naming conventions
      - id: check-naming
        name: "📛 Check Naming Conventions"
        entry: python scripts/quality/check_naming.py
        language: system
        files: \.py$
        exclude: ^(tests/|legacy/)
        
      # Verificar complejidad
      - id: check-complexity
        name: "🧩 Check Code Complexity"
        entry: python scripts/quality/check_complexity.py --max-complexity 10
        language: system
        files: \.py$
        exclude: ^(tests/|legacy/)

  # =============================================================================
  # NOTEBOOKS
  # =============================================================================
  
  # Limpiar outputs de notebooks
  - repo: https://github.com/kynan/nbstripout
    rev: 0.6.1
    hooks:
      - id: nbstripout
        name: "📓 Strip Notebook Outputs"
        args: [--extra-keys=metadata.kernelspec]

  # =============================================================================
  # COMMITS
  # =============================================================================
  
  # Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        name: "💬 Check Commit Message Format"
        stages: [commit-msg]
        args: []

# Configuración adicional para CI local
ci:
  # Estos hooks se ejecutan solo en CI (no localmente)
  skip: []
  
  # Auto-update de versiones
  autoupdate_schedule: weekly
  autoupdate_commit_msg: 'chore: auto-update pre-commit hooks'

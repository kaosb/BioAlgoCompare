[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "venv",
    "legacy",
    "examples"
]

# Same as Black.
line-length = 88

# Allow specific style violations common in scientific/research code
# F401: Unused imports - needed for __init__.py re-exports
# E501: Line too long - mathematical formulas and URLs can be long  
# E741: Ambiguous names - mathematical notation uses l, O, I
# E402: Module import not at top - needed for sys.path modifications
# 
# CONSIDER FIXING THESE:
# E712: Comparison to True/False - use 'is' instead
# F841: Unused variables - might indicate dead code
# F823: Variable used before assignment - can cause runtime errors
# E722: Bare except - dangerous, catches system exits
# F811: Redefinition - might indicate copy-paste errors
ignore = ["F401", "E501", "E741", "E402"]

# Target Python 3.8+
target-version = "py38"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "scripts",
    "utils/improved",
    "utils/backup",
    "legacy"
]

# Same as Black.
line-length = 88

# Allow inputs to have unused imports, long lines, boolean comparison and others.
ignore = ["F401", "E501", "E712", "E741", "F841", "F823", "E722", "F811"]

# Target Python 3.8+
target-version = "py38"
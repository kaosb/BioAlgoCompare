[tox]
envlist = py38,py39,py310

[testenv]
deps =
    pytest
    pytest-cov
commands =
    pytest --cov={envsitepackagesdir}/optimizacion

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=algorithms --cov=problems --cov=utils --cov=scripts --cov-report=term-missing --cov-report=xml
markers =
    slow: marks tests as slow (deselect with '-k "not slow"')

[coverage:run]
source =
    algorithms
    problems
    utils
    scripts
omit =
    tests/*
    */__pycache__/*
    */\.*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
    except ImportError
